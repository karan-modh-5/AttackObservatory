# Attack Observatory — cowrie configuration overrides.
# Loaded by the cowrie/cowrie image; anything not set here falls back to the
# packaged defaults (cowrie.cfg.dist). Note: cowrie.cfg does NOT interpolate
# environment variables, so COWRIE_HOSTNAME from .env is informational — keep
# this value in sync when you change it.

[honeypot]
# Hostname shown in the fake shell prompt.
hostname = svc-01

# Cap stored malware artifacts (bytes per downloaded file) to protect the 10GB disk.
download_limit_size = 5242880

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.4

# Credential policy: ShardLure persona userdb (mined from real botnet brute-force
# lists). Exact matches only (plus guest/debian any-password); probe strings are
# denied first. Replaces the stock userdb that allowed root with ANY password.
userdb_path = /cowrie/cowrie-git/etc/userdb.txt

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json

# Disable secondary outputs to save disk (contract §6/§9 resource budget).
[output_textlog]
enabled = false

[output_userdata]
enabled = false
