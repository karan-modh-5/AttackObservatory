# Attack Observatory — nginx frontend (serves the React SPA, proxies the API).
# Mounted read-only at /etc/nginx/conf.d/default.conf in the `web` service.

server {
    listen 80;
    # IPv6 listener: busybox wget (container healthcheck) resolves localhost to
    # ::1 first and does not fall back to IPv4.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA uploads (IOC import etc.) — keep small on the 512MB box.
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Docker's embedded DNS resolves the `api` service. The variable form of
    # proxy_pass defers name resolution to request time, so nginx can start
    # even while the api container is being created/restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # REST API — original URI (/api/v1/...) is forwarded unchanged.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Live event stream (WebSocket). Long timeouts: connections stay open for hours.
    location /api/v1/ws/live {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    # Hashed build assets never change content: cache forever. index.html must
    # always revalidate, otherwise browsers pin a stale bundle for days and
    # miss deploys (observed: an old index-BWIhS1jP.js served a day later).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # SPA fallback: BrowserRouter routes resolve to index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
