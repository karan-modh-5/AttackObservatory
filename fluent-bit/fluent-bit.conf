# Attack Observatory — Fluent Bit agent config.
# Tails the five honeypot log files (contract §7 paths) and POSTs batches to the
# api ingest endpoints. OBS_INGEST_API_KEY is injected into the container by
# docker-compose; Fluent Bit expands ${OBS_INGEST_API_KEY} at load time.

[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

# ------------------------------------------------------------------- cowrie (JSON lines)
[INPUT]
    Name            tail
    Tag             cowrie
    Path            /var/log/honeypot/cowrie/cowrie.json
    Parser          json
    Read_from_Head  true
    Skip_Long_Lines On
    Buffer_Chunk_Size 64k
    Buffer_Max_Size 512k
    DB              /flb-db/cowrie.db

# ------------------------------------------------------------------- snare (raw stdout)
[INPUT]
    Name            tail
    Tag             snare
    Path            /var/log/honeypot/snare/snare.log
    Read_from_Head  true
    Skip_Long_Lines On
    Buffer_Chunk_Size 64k
    Buffer_Max_Size 512k
    DB              /flb-db/snare.db

# ------------------------------------------------------------------- tanner (raw stdout)
[INPUT]
    Name            tail
    Tag             tanner
    Path            /var/log/honeypot/tanner/tanner.log
    Read_from_Head  true
    Skip_Long_Lines On
    Buffer_Chunk_Size 64k
    Buffer_Max_Size 512k
    DB              /flb-db/tanner.db

# ------------------------------------------------------------------- tanner detections (per-request JSON verdicts: sqli/lfi/rfi/xss)
[INPUT]
    Name            tail
    Tag             tanner-report
    Path            /var/log/honeypot/tanner/tanner_report.json
    Parser          json
    Read_from_Head  true
    Skip_Long_Lines On
    Buffer_Chunk_Size 64k
    Buffer_Max_Size 512k
    DB              /flb-db/tanner-report.db

# ------------------------------------------------------------------- heralding (raw CSV lines)
[INPUT]
    Name            tail
    Tag             heralding
    Path            /var/log/honeypot/heralding/heralding_auth.csv
    Read_from_Head  true
    Skip_Long_Lines On
    Buffer_Chunk_Size 64k
    Buffer_Max_Size 512k
    DB              /flb-db/heralding.db

# ------------------------------------------------------------------- suricata (JSON lines)
[INPUT]
    Name            tail
    Tag             suricata
    Path            /var/log/honeypot/suricata/eve.json
    Parser          json
    Read_from_Head  true
    Skip_Long_Lines On
    Buffer_Chunk_Size 64k
    Buffer_Max_Size 512k
    DB              /flb-db/suricata.db

# ------------------------------------------------------------------- outputs
[OUTPUT]
    Name            http
    Match           cowrie
    Host            api
    Port            8000
    URI             /api/v1/ingest/cowrie
    Format          json
    json_date_key   false
    Retry_Limit     False
    Header          X-API-Key ${OBS_INGEST_API_KEY}
    tls             Off

[OUTPUT]
    Name            http
    Match           snare
    Host            api
    Port            8000
    URI             /api/v1/ingest/snare
    Format          json
    json_date_key   false
    Retry_Limit     False
    Header          X-API-Key ${OBS_INGEST_API_KEY}
    tls             Off

[OUTPUT]
    Name            http
    Match           tanner
    Host            api
    Port            8000
    URI             /api/v1/ingest/tanner
    Format          json
    json_date_key   false
    Retry_Limit     False
    Header          X-API-Key ${OBS_INGEST_API_KEY}
    tls             Off

[OUTPUT]
    Name            http
    Match           tanner-report
    Host            api
    Port            8000
    URI             /api/v1/ingest/tanner
    Format          json
    json_date_key   false
    Retry_Limit     False
    Header          X-API-Key ${OBS_INGEST_API_KEY}
    tls             Off

[OUTPUT]
    Name            http
    Match           heralding
    Host            api
    Port            8000
    URI             /api/v1/ingest/heralding
    Format          json
    json_date_key   false
    Retry_Limit     False
    Header          X-API-Key ${OBS_INGEST_API_KEY}
    tls             Off

[OUTPUT]
    Name            http
    Match           suricata
    Host            api
    Port            8000
    URI             /api/v1/ingest/suricata
    Format          json
    json_date_key   false
    Retry_Limit     False
    Header          X-API-Key ${OBS_INGEST_API_KEY}
    tls             Off
