# Attack Observatory — tanner configuration.
# Based on the upstream docker/tanner/dist/config.yaml with these changes:
#   REDIS.host -> 127.0.0.1   (in-container redis, see tanner/Dockerfile)
#   TANNER/WEB/API/PHPOX hosts -> 0.0.0.0 (bind without DNS resolution)
# Only the main tanner listener (8090) is consumed by snare; the web/api/phpox
# listeners stay internal to the container.

DATA:
  db_config: /opt/tanner/db/db_config.json
  dorks: /opt/tanner/data/dorks.pickle
  user_dorks: /opt/tanner/data/user_dorks.pickle
  crawler_stats: /opt/tanner/data/crawler_user_agents.txt
  geo_db: /opt/tanner/db/GeoLite2-City.mmdb
  tornado: /opt/tanner/data/tornado.py
  mako: /opt/tanner/data/mako.py

TANNER:
  host: 0.0.0.0
  port: 8090

WEB:
  host: 0.0.0.0
  port: 8091

API:
  host: 0.0.0.0
  port: 8092
  auth: False
  auth_signature: tanner_api_auth

PHPOX:
  host: 0.0.0.0
  port: 8088

REDIS:
  host: 127.0.0.1
  port: 6379
  poolsize: 10
  timeout: 1

EMULATORS:
  root_dir: /tmp/tanner/emulators

EMULATOR_ENABLED:
  sqli: True
  rfi: True
  lfi: False
  xss: True
  cmd_exec: False
  php_code_injection: True
  php_object_injection: True
  crlf: True
  xxe_injection: True
  template_injection: False

SQLI:
  type: SQLITE
  db_name: tanner_db
  host: localhost
  user: root
  password: user_pass

XXE_INJECTION:
  OUT_OF_BAND: False

RFI:
  allow_insecure: True

DOCKER:
  host_image: busybox:latest

LOGGER:
  log_debug: /tmp/tanner/tanner.log
  log_err: /tmp/tanner/tanner.err

MONGO:
  enabled: False
  URI: mongodb://localhost

HPFEEDS:
  enabled: False
  HOST: localhost
  PORT: 10000
  IDENT: ''
  SECRET: ''
  CHANNEL: tanner.events

LOCALLOG:
  enabled: True
  PATH: /tmp/tanner/tanner_report.json

CLEANLOG:
  enabled: False

REMOTE_DOCKERFILE:
  GITHUB: "https://raw.githubusercontent.com/mushorg/tanner/master/docker/tanner/template_injection/Dockerfile"

SESSIONS:
  delete_timeout: 300
